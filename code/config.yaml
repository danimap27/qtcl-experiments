# =============================================================
# QTCL — Quantum Transfer-Continual Learning
# Configuration File
# =============================================================
experiment_name: "qtcl_v1"
output_dir: "./results"
device: "auto"

# =============================================================
# RANDOM SEEDS
# =============================================================
seeds: [0, 42, 123, 456, 789]

# =============================================================
# DATASETS
# =============================================================
datasets:
  - name: "split_mnist"
    root: "./data/datasets"
    n_tasks: 5
    image_size: 32
    # 20% subset of full data → 80% train+val / 20% test → 80/20 train/val
    subset_fraction: 0.2
    train_test_split: 0.8     # 80% of subset → train+val, 20% → test
    train_val_split: 0.8      # 80% of train+val → train, 20% → val

  - name: "split_cifar10"
    root: "./data/datasets"
    n_tasks: 5
    image_size: 32
    subset_fraction: 0.2
    train_test_split: 0.8
    train_val_split: 0.8

# =============================================================
# BACKBONES (ImageNet-pretrained, frozen)
# =============================================================
backbones:
  - name: "resnet18"
    feature_dim: 512
    frozen: true
  - name: "mobilenetv2"
    feature_dim: 1280
    frozen: true
  - name: "efficientnet_b0"
    feature_dim: 1280
    frozen: true

# =============================================================
# CLASSIFICATION HEADS
# =============================================================
heads:
  # --- Classical baselines ---
  - name: "linear"
    type: "classical"
    description: "Single linear layer (no hidden)"
    variant: "linear"

  - name: "mlp"
    type: "classical"
    description: "MLP (128 hidden, ReLU, Dropout 0.3)"
    variant: "mlp"
    hidden_dim: 128
    dropout: 0.3

  - name: "mlp_deep"
    type: "classical"
    description: "Two-hidden-layer MLP (128 → 64)"
    variant: "mlp_deep"
    hidden_dim: 128
    dropout: 0.3

  # --- Qiskit Hybrid Quantum-Classical ---
  - name: "qk_ideal"
    type: "qiskit"
    description: "Qiskit dual-path hybrid (StatevectorEstimator, exact)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false

  - name: "qk_noisy"
    type: "qiskit"
    description: "Qiskit dual-path hybrid (AerSimulator, IBM Heron r2 noise model)"
    backend: "aer"
    n_qubits: 4
    depth: 2
    noise: true
    shots: 1024
    gradient_method: "spsa"
    ansatz: "circular"
    noise_params:
      T1_us: 250
      T2_us: 150
      t1q_ns: 32
      t2q_ns: 68
      p1q: 0.0002
      p2q: 0.005
      readout_error: 0.012

  # --- Quantum ansatz variants (for arch_variants study) ---
  - name: "qk_linear"
    type: "qiskit"
    description: "VQC with linear (non-circular) CNOT entanglement"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "linear"

  - name: "qk_no_ent"
    type: "qiskit"
    description: "VQC with NO entanglement (rotations only)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "no_ent"

  - name: "qk_real_amp"
    type: "qiskit"
    description: "RealAmplitudes ansatz (full entanglement)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "real_amp"

  - name: "qk_efficient_su2"
    type: "qiskit"
    description: "EfficientSU2 ansatz (R_Y + R_Z + circular)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "efficient_su2"

  - name: "qk_two_local"
    type: "qiskit"
    description: "TwoLocal ansatz (R_X + R_Y, CZ entanglement)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "two_local"

  - name: "qk_re_upload"
    type: "qiskit"
    description: "Data re-uploading VQC (encoding repeated each layer)"
    backend: "statevector"
    n_qubits: 4
    depth: 2
    noise: false
    ansatz: "re_upload"

# =============================================================
# EWC HYPERPARAMETERS
# =============================================================
ewc:
  lambda: 5000
  fisher_samples: 200
  buffer_size: 200          # for replay method

# Default CL method ('naive' | 'l2' | 'ewc' | 'si' | 'derpp' | 'replay')
cl_method: "ewc"

# =============================================================
# TRAINING HYPERPARAMETERS
# =============================================================
training:
  optimizer: "adam"
  lr: 0.001
  batch_size: 32
  epochs_per_task: 10
  loss: "cross_entropy"
  scheduler:
    type: "step_lr"
    step_size: 3
    gamma: 0.9

# =============================================================
# ADDITIONAL STUDIES
# =============================================================

# --- Ablation: circuit depth and n_qubits ---
# Full sweep including 16 qubits and depth 5. 2 seeds for budget.
# 2 datasets × 1 backbone × 2 heads × 5 qubits × 5 depths × 2 seeds = 200 runs
# minus the default (q=4, d=2) overlap with main = 192 ablation runs.
ablation:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18"]
  heads: ["qk_ideal", "qk_noisy"]
  qubits: [2, 4, 6, 8, 16]
  depths: [1, 2, 3, 4, 5]
  seeds: [42, 123]

# --- EWC Lambda Sensitivity ---
lambda_sensitivity:
  enabled: true
  datasets: ["split_cifar10"]
  backbones: ["resnet18"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  lambdas: [0, 100, 500, 1000, 5000, 10000, 50000]
  seeds: [42]

# --- Scalability: number of sequential tasks ---
scalability:
  enabled: true
  datasets: ["split_mnist", "split_cifar10"]
  backbones: ["resnet18"]
  heads: ["mlp", "qk_ideal", "qk_noisy"]
  seeds: [42, 123]

# --- CL methods comparison: naive, L2, EWC, SI, MAS, replay ---
# 1 dataset × 1 backbone × 1 head × 6 methods × 5 seeds = 30 runs
cl_methods_study:
  enabled: true
  datasets: ["split_mnist"]
  backbones: ["resnet18"]
  heads: ["mlp", "qk_ideal"]
  methods: ["naive", "l2", "ewc", "si", "derpp", "replay"]
  seeds: [0, 42, 123, 456, 789]

# --- Architecture variants: classical and quantum ansatz comparison ---
# 1 dataset × 1 backbone × multiple heads × EWC × 5 seeds
arch_variants:
  enabled: true
  datasets: ["split_mnist"]
  backbones: ["resnet18"]
  heads: ["linear", "mlp", "mlp_deep",
          "qk_ideal", "qk_linear", "qk_no_ent",
          "qk_real_amp", "qk_efficient_su2", "qk_two_local", "qk_re_upload"]
  seeds: [0, 42, 123, 456, 789]

# --- Noise Decomposition: impact per channel ---
noise_decomposition:
  enabled: true
  datasets: ["split_cifar10"]
  backbones: ["resnet18"]
  base_head: "qk_noisy"
  channels:
    - name: "amplitude_damping"
      noise_channels: ["amplitude_damping"]
    - name: "phase_damping"
      noise_channels: ["phase_damping"]
    - name: "depolarizing"
      noise_channels: ["depolarizing"]
  n_qubits: 4
  depth: 2
  seeds: [42]

# =============================================================
# VISUALIZATION
# =============================================================
visualization:
  enabled: true
  plots_subdir: "plots"
  dpi: 150

# =============================================================
# CHECKPOINTS
# =============================================================
checkpoints:
  enabled: true
  save_best: true
  save_last: true
  resume: true
